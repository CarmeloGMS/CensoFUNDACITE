services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-censo_campesino}
      POSTGRES_USER: ${POSTGRES_USER:-censo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-censo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-censo} -d ${POSTGRES_DB:-censo_campesino}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-local-development-key}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-censo_campesino}
      POSTGRES_USER: ${POSTGRES_USER:-censo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-censo}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MEDIA_ROOT: /app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["web"]
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
